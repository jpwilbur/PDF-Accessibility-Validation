<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ObservePoint PDF Validation{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav" role="navigation">
  <a class="brand" href="/" aria-label="ObservePoint PDF Validation — home">
    <span class="brand-wordmark" aria-hidden="true">
      <span class="obs">Observe</span><span class="pt">Point</span>
    </span>
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="brand-sub">PDF Validation</span>
  </a>
  <a class="navlink" href="/">New run</a>
  <a class="navlink" href="/runs">History</a>
  <span class="grow"></span>
  <span class="meta">v{{ app_version }}</span>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  Local app · matches the validation flow at <a href="https://www.observepoint.com" target="_blank" rel="noopener">observepoint.com</a> · evaluates against PDF/UA-1, Matterhorn, WCAG 2.1, Section 508.
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
