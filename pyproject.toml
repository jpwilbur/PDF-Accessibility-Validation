[project]
name = "pdf-a11y"
version = "0.1.0"
description = "Production-grade batch PDF accessibility evaluator (PDF/UA, Matterhorn, WCAG, Section 508)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "ObservePoint" }]

dependencies = [
    "pikepdf>=9.4",
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "Pillow>=10.4",
    "numpy>=2.0",
    "lxml>=5.3",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13.9",
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
    "structlog>=24.4",
    "platformdirs>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "lxml-stubs",
]

[project.scripts]
pdf-a11y = "pdf_a11y.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_a11y"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle/pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "N",              # pep8-naming
    "PT",             # pytest style
    "ARG",            # unused args
    "PTH",            # pathlib
    "TRY",            # tryceratops
]
ignore = [
    "TRY003",  # long exception messages are fine here
    "TRY300",
    "RUF002",  # × is intentional in scoring formulas
    "RUF003",  # × is intentional in formula comments
    "RUF012",  # immutable class-level metadata; never mutated
    "UP042",   # str+Enum (instead of StrEnum) needed for pydantic v2 JSON compat
    "UP047",   # generic TypeVar style is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]  # tests can use mixed-case names like "_F_" for grade letters

[tool.mypy]
python_version = "3.12"
strict = false  # global default; per-module strict below
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pdf_a11y.checks.*", "pdf_a11y.models", "pdf_a11y.scoring"]
strict = true

[[tool.mypy.overrides]]
module = ["pikepdf.*", "fitz", "pdfplumber.*", "pytesseract", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration tests that download real PDFs",
    "needs_verapdf: requires verapdf binary on PATH",
    "needs_tesseract: requires tesseract on PATH",
]
